<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Mes billets — O'KABA</title>
  <link rel="icon" type="image/png" href="/assets/okaba-app-icon.png"/>
  <style>
    :root{ --vert:#0A6A2F; --vertDeep:#054D22; --or:#F5B800; --ink:#1A1A1A; --ink2:#5C5C5C; --ink3:#8E8E8E; --line:#E6E9E6; --bg:#F4F6F4; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:"Manrope",-apple-system,system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; padding:22px 16px 40px; }
    .wrap{ max-width:460px; margin:0 auto; }
    .brand{ display:flex; flex-direction:column; align-items:center; gap:8px; margin:6px 0 18px; }
    .brand img{ height:30px; }
    .brand .sub{ font-size:11px; font-weight:800; letter-spacing:1px; color:var(--ink2); }
    .brand .sub b{ color:var(--vert); }
    .head{ text-align:center; margin-bottom:16px; }
    .head h1{ font-size:22px; font-weight:800; letter-spacing:-.4px; }
    .head p{ margin-top:6px; font-size:13px; color:var(--ink2); }
    .ticket{ position:relative; background:#fff; border-radius:20px; box-shadow:0 8px 28px rgba(18,51,31,.10); overflow:hidden; margin-bottom:16px; border:1px solid var(--line); }
    .ticket .top{ background:linear-gradient(135deg,var(--vert),var(--vertDeep)); color:#fff; padding:16px 18px; }
    .ticket .top .ev{ font-size:16px; font-weight:800; }
    .ticket .top .meta{ margin-top:5px; font-size:11.5px; opacity:.92; }
    .ticket .body{ padding:16px 18px; display:flex; align-items:center; gap:16px; }
    .ticket .code{ flex:1; }
    .ticket .code .lbl{ font-size:9.5px; font-weight:800; letter-spacing:.7px; color:var(--ink3); }
    .ticket .code .val{ margin-top:4px; font-size:24px; font-weight:900; letter-spacing:2px; color:var(--vert); }
    .ticket .code .row{ margin-top:10px; display:flex; gap:18px; }
    .ticket .code .row .lbl2{ font-size:9px; color:var(--ink3); }
    .ticket .code .row .v2{ font-size:12.5px; font-weight:800; }
    .ticket .qr{ width:96px; height:96px; flex-shrink:0; border:1px solid var(--line); border-radius:12px; padding:6px; background:#fff; }
    .ticket .qr svg, .ticket .qr img{ width:100%; height:100%; display:block; }
    .perf{ position:absolute; top:calc(100% - 0px); }
    .num{ position:absolute; top:12px; right:14px; font-size:10.5px; font-weight:800; color:rgba(255,255,255,.85); }
    .dl{ position:sticky; bottom:0; }
    button.dl-btn{ width:100%; max-width:460px; margin:6px auto 0; display:flex; align-items:center; justify-content:center; gap:10px;
      height:54px; border:none; border-radius:15px; background:var(--vert); color:#fff; font:inherit; font-size:15px; font-weight:800; cursor:pointer;
      box-shadow:0 10px 24px rgba(10,106,47,.32); }
    .hint{ text-align:center; font-size:11.5px; color:var(--ink3); margin-top:12px; }
    .empty{ text-align:center; color:var(--ink2); padding:40px 10px; }
    @media print{
      body{ background:#fff; padding:0; }
      .dl, .hint{ display:none !important; }
      .ticket{ box-shadow:none; page-break-inside:avoid; border:1px solid #ccc; margin:10px; }
      .brand{ margin-top:14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="/assets/okaba-wordmark.png" alt="O'KABA"/>
      <div class="sub">TOUT LE <b>GABON</b> DANS VOTRE MAIN</div>
    </div>
    <div class="head">
      <h1>Vos billets</h1>
      <p id="sub">Présentez ce billet à l'entrée.</p>
    </div>
    <div id="tickets"></div>
  </div>
  <div class="dl">
    <button class="dl-btn" onclick="window.print()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      Télécharger le PDF
    </button>
    <div class="hint">Astuce : dans la boîte d'impression, choisissez « Enregistrer en PDF ».</div>
  </div>

  <!-- Générateur de QR (inclus avec l'app) -->
  <script src="/vendor/qrcode.min.js"></script>
  <script>
    var P = new URLSearchParams(location.search);
    var event = P.get('event') || 'Événement O’KABA';
    var date  = P.get('date')  || '';
    var place = P.get('place') || '';
    var tier  = P.get('tier')  || 'Standard';
    var code  = P.get('code')  || 'OKT-000000';
    var total = P.get('total') || '';
    var qty   = Math.max(1, Math.min(8, parseInt(P.get('qty') || '1', 10) || 1));

    document.getElementById('sub').textContent =
      qty > 1 ? ('Vos ' + qty + ' billets pour « ' + event + ' ».') : ('Votre billet pour « ' + event + ' ».');

    var host = document.getElementById('tickets');
    if (!P.toString()) {
      host.innerHTML = '<div class="empty">Aucun billet à afficher.</div>';
    } else {
      for (var i = 1; i <= qty; i++) {
        var el = document.createElement('div');
        el.className = 'ticket';
        el.innerHTML =
          '<div class="top"><div class="ev">' + esc(event) + '</div>' +
          '<div class="meta">' + esc([date, place].filter(Boolean).join('  ·  ')) + '</div>' +
          (qty > 1 ? '<div class="num">' + i + '/' + qty + '</div>' : '') + '</div>' +
          '<div class="body">' +
            '<div class="code">' +
              '<div class="lbl">CODE D’ACCÈS</div>' +
              '<div class="val">' + esc(code) + (qty > 1 ? '-' + i : '') + '</div>' +
              '<div class="row">' +
                '<div><div class="lbl2">Catégorie</div><div class="v2">' + esc(tier) + '</div></div>' +
                (total ? '<div><div class="lbl2">Total</div><div class="v2">' + esc(total) + '</div></div>' : '') +
              '</div>' +
            '</div>' +
            '<div class="qr" id="qr' + i + '"></div>' +
          '</div>';
        host.appendChild(el);
      }
      // QR par billet (contenu = code d'accès, pour le contrôle à l'entrée)
      if (window.QRCode) {
        for (var j = 1; j <= qty; j++) {
          (function(n){
            QRCode.toString((code + (qty > 1 ? '-' + n : '')), { type:'svg', margin:0,
              color:{ dark:'#0A6A2F', light:'#00000000' } }, function(err, svg){
              if (!err) document.getElementById('qr' + n).innerHTML = svg;
            });
          })(j);
        }
      }
    }
    function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }
  </script>
</body>
</html>
