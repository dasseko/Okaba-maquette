<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>O'KABA — Démo modération IA</title>
<style>
  :root{ --green:#0A6A2F; --gold:#F5B800; --bg:#F5F7F1; --ink:#111827; --line:#E3E8DD; --red:#E0241B; }
  *{box-sizing:border-box} body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--green);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
  header .logo{font-weight:900;font-size:20px} header .logo b{color:var(--gold)}
  header small{opacity:.85;margin-left:auto}
  .wrap{max-width:1050px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:340px 1fr;gap:22px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
  h2{margin:0 0 14px;font-size:17px;color:var(--green)}
  label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:#6B7280}
  .drop img{max-height:150px;border-radius:8px;margin-top:8px}
  button.pub{margin-top:14px;width:100%;background:var(--green);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;font-size:15px;cursor:pointer}
  button.pub:disabled{opacity:.6;cursor:wait}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
  .tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .item{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .item img{width:100%;height:110px;object-fit:cover;display:block}
  .item .b{padding:8px 10px} .item .t{font-weight:800;font-size:13px} .item .d{font-size:11px;color:#6B7280;margin-top:2px}
  .item .ok{display:inline-block;margin-top:6px;font-size:10px;font-weight:800;color:var(--green);background:rgba(10,106,47,.1);padding:2px 7px;border-radius:20px}
  .empty{color:#9aa;grid-column:1/-1;padding:30px;text-align:center}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .ic{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:30px}
  .modal.rej .ic{background:rgba(224,36,27,.12)} .modal.ok .ic{background:rgba(10,106,47,.12)}
  .modal h3{margin:0 0 8px} .modal.rej h3{color:var(--red)} .modal.ok h3{color:var(--green)}
  .modal p{color:#374151;font-size:14px;line-height:1.5} .modal button{margin-top:16px;border:none;border-radius:10px;padding:10px 22px;font-weight:800;cursor:pointer;background:var(--green);color:#fff}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <span class="logo"><b>O'</b>KABA</span>
  <span>· Démo modération IA</span>
  <small>CLIP + NSFW — l'image doit correspondre à la catégorie</small>
</header>

<div class="wrap">
  <!-- Formulaire -->
  <div class="card">
    <h2>Publier une annonce</h2>
    <form id="f">
      <label>Titre</label>
      <input id="title" required placeholder="Ex : Toyota RAV4 2019"/>
      <label>Description</label>
      <textarea id="description" placeholder="Décris ton article…"></textarea>
      <label>Catégorie</label>
      <select id="category" required></select>
      <label>Photo</label>
      <div class="drop" id="drop">📷 Choisir une image<input type="file" id="image" accept="image/*" hidden/><div id="prev"></div></div>
      <button class="pub" id="btn" type="submit">Publier</button>
    </form>
  </div>

  <!-- Annonces publiées -->
  <div class="card">
    <h2>Annonces publiées</h2>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal">
  <div class="ic" id="mic"></div><h3 id="mt"></h3><p id="mp"></p>
  <button onclick="document.getElementById('ov').classList.remove('show')">OK</button>
</div></div>

<script>
const $=s=>document.querySelector(s);
let cats=[], current="";
async function init(){
  cats=await (await fetch("/api/categories")).json();
  $("#category").innerHTML=cats.map(c=>`<option value="${c.id}">${c.nom}</option>`).join("");
  $("#tabs").innerHTML=`<button class="on" data-c="">Tout</button>`+cats.map(c=>`<button data-c="${c.id}">${c.nom}</button>`).join("");
  $("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;current=b.dataset.c;[...$("#tabs").children].forEach(x=>x.classList.toggle("on",x===b));load();};
  load();
}
async function load(){
  const list=await (await fetch("/api/articles"+(current?`?category=${current}`:""))).json();
  $("#grid").innerHTML = list.length? list.map(a=>{
    const cn=(cats.find(c=>c.id===a.category)||{}).nom||a.category;
    return `<div class="item"><img src="${a.image}"/><div class="b"><div class="t">${a.title}</div><div class="d">${cn}</div><span class="ok">✔ vérifié · ${a.relevance}%</span></div></div>`;
  }).join("") : `<div class="empty">Aucune annonce ici pour l'instant.</div>`;
}
// image picker
$("#drop").onclick=()=>$("#image").click();
$("#image").onchange=e=>{const f=e.target.files[0];if(f)$("#prev").innerHTML=`<img src="${URL.createObjectURL(f)}"/>`;};
// modal
function popup(kind,title,msg){$("#modal").className="modal "+kind;$("#mic").textContent=kind==="ok"?"✅":"🚫";$("#mt").textContent=title;$("#mp").textContent=msg;$("#ov").classList.add("show");}
// submit
$("#f").onsubmit=async e=>{
  e.preventDefault();
  const file=$("#image").files[0];
  if(!file){popup("rej","Image requise","Ajoute une photo pour publier.");return;}
  const fd=new FormData();
  fd.append("title",$("#title").value); fd.append("description",$("#description").value);
  fd.append("category",$("#category").value); fd.append("image",file);
  const btn=$("#btn"); btn.disabled=true; btn.innerHTML='<span class="spin"></span>Vérification IA…';
  try{
    const r=await (await fetch("/api/publish",{method:"POST",body:fd})).json();
    if(r.status==="approved"){ popup("ok","Annonce publiée","Ton image correspond bien à la catégorie. Elle est en ligne ✅"); $("#f").reset(); $("#prev").innerHTML=""; load(); }
    else { popup("rej","Publication refusée", r.reason||"Non conforme."); }
  }catch(err){ popup("rej","Erreur", err.message); }
  btn.disabled=false; btn.textContent="Publier";
};
init();
</script>
</body>
</html>
