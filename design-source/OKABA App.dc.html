<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    #okaba-stage *::-webkit-scrollbar { width: 0; height: 0; }
    #okaba-stage * { scrollbar-width: none; }
    #okaba-stage button { font-family: inherit; }
    @keyframes okSlideFwd { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes okSlideBack { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  </style>
</helmet>
<div id="okaba-stage" style="min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; padding: 40px 20px; box-sizing: border-box; font-family: 'Manrope', system-ui, sans-serif; background: radial-gradient(1200px 800px at 50% -10%, #15311f 0%, transparent 55%), linear-gradient(165deg, #0c2415 0%, #08160d 55%, #050b07 100%);">
  <x-import component-from-global-scope="OkabaApp" from="./okaba-bundle.jsx" hint-size="418px,872px"></x-import>
</div>
</x-dc>
</body>
</html>
